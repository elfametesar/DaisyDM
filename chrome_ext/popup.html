<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; width: 240px; padding: 16px; background: #1c1c1e; color: #f2f2f7; margin: 0; }
    h3 { margin-top: 0; margin-bottom: 16px; font-size: 15px; font-weight: 600; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: #aaa; }
    select { width: 100%; padding: 8px; background: #2c2c2e; color: white; border: 1px solid #444; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
    .toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0a84ff; cursor: pointer; }
  </style>
</head>
<body>
  <h3>Dispatch Settings</h3>
  
  <label>Hold key to bypass extension:</label>
  <select id="bypassKey">
    <option value="Alt">Option / Alt</option>
    <option value="Shift">Shift</option>
    <option value="Control">Control</option>
    <option value="Meta">Command / Windows</option>
  </select>

  <div class="toggle">
    <input type="checkbox" id="disableExtension">
    <label for="disableExtension" style="margin:0; color: #f2f2f7; cursor: pointer;">Pause Extension</label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
