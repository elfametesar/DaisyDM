name: Remove duplicate tab helper

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate helper from ProgressWindowView
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/Daisy/UI/Screens/ProgressWindowView.swift")
          text = path.read_text()
          start = text.find("\nstruct TabBarContextMenuDisabler: NSViewRepresentable {")

          if start == -1:
              print("Duplicate helper already removed; nothing to do.")
              raise SystemExit(0)

          end_marker = "\n\n// MARK: - Subcomponents"
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit("Helper end marker not found")

          path.write_text(text[:start] + text[end:])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Daisy/UI/Screens/ProgressWindowView.swift

          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi

          git commit -m "fix: remove duplicate tab helper"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-duplicate-tab-helper.yml
          git commit -m "chore: remove temporary duplicate helper workflow"
          git push
