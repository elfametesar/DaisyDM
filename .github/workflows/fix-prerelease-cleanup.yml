name: Fix prerelease cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch release cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/manual-build-release.yml')
          text = path.read_text()
          start = text.index('      - name: Remove previous prereleases\n')
          end = text.index('      - name: Create release\n', start)

          replacement = '''      - name: Remove previous prereleases
        if: ${{ inputs.prerelease }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t prerelease_tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.prerelease == true and .draft == false) | .tag_name'
          )

          for old_tag in "${prerelease_tags[@]}"; do
            [[ "$old_tag" == "$CURRENT_TAG" ]] && continue
            echo "Deleting previous prerelease: $old_tag"
            gh release delete "$old_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          done

'''

          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit and remove fixer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/manual-build-release.yml
          git commit -m 'fix: reliably remove old prereleases'
          git rm .github/workflows/fix-prerelease-cleanup.yml
          git commit -m 'chore: remove one-time prerelease fixer'
          git push
