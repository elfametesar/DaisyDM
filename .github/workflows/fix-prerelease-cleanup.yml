name: Fix prerelease cleanup logic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix cleanup step
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/manual-build-release.yml')
          text = path.read_text()

          start = text.index('      - name: Remove previous prereleases\n')
          end = text.index('      - name: Create release\n', start)

          replacement = '''      - name: Remove previous prereleases
        if: ${{ inputs.prerelease }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t prerelease_tags < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.prerelease == true and .draft == false) | .tag_name'
          )

          for old_tag in "${prerelease_tags[@]}"; do
            [[ "$old_tag" == "$CURRENT_TAG" ]] && continue
            echo "Deleting previous prerelease: $old_tag"
            gh release delete "$old_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          done

'''

          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/manual-build-release.yml
          if git diff --cached --quiet; then
            echo 'No cleanup change needed.'
          else
            git commit -m 'fix: reliably remove old prereleases'
            git push
          fi

      - name: Remove this workflow
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/fix-prerelease-cleanup.yml" \
            -f message='chore: remove one-time prerelease fix workflow' \
            -f sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/fix-prerelease-cleanup.yml" --jq '.sha')" \
            -f branch='main'
