name: Cleanup old prereleases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only newest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t releases < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.prerelease == true and .draft == false) | [.published_at, .tag_name] | @tsv' \
              | sort -r
          )

          for entry in "${releases[@]:1}"; do
            tag="${entry#*$'\t'}"
            echo "Deleting old prerelease: ${tag}"
            gh release delete "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          done

      - name: Remove cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cleanup-prereleases.yml" \
            -f message='chore: remove one-time prerelease cleanup workflow' \
            -f sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cleanup-prereleases.yml" --jq '.sha')" \
            -f branch='main'
