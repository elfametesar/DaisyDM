name: Fix sort toolbar label

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sort-toolbar-label.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Sort label layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Sources/Daisy/UI/Screens/ContentView.swift')
          lines = path.read_text().splitlines()

          for i, line in enumerate(lines):
              if 'Label("Sort", systemImage: "arrow.up.arrow.down")' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i:i+1] = [
                      indent + 'VStack(spacing: 2) {',
                      indent + '    Image(systemName: "arrow.up.arrow.down")',
                      indent + '    Text("Sort")',
                      indent + '        .font(.caption2)',
                      indent + '}',
                      indent + '.frame(minWidth: 44)',
                  ]
                  break
          else:
              raise SystemExit('Sort label line not found')

          lines = [line for line in lines if '.labelStyle(.titleAndIcon)' not in line]
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit source fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/Daisy/UI/Screens/ContentView.swift
          git commit -m 'fix: show Sort label below icon'
          git rm .github/workflows/fix-sort-toolbar-label.yml
          git commit -m 'chore: remove one-time sort label fixer'
          git push origin main
