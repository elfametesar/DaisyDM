name: One-off layout fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: reduce minimum window width'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/Daisy/App/AppDelegate.swift')
          text = path.read_text()
          old = 'showingDetailPanel ? 1300 : 425'
          new = 'showingDetailPanel ? 1300 : 900'
          if old not in text:
              raise SystemExit(f'expected text not found: {old}')
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-off-layout-fix.yml
          git add Sources/Daisy/App/AppDelegate.swift
          git commit -m 'fix: reduce minimum window width'
          git push
