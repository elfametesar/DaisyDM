name: Build & Release Daisy DM

run-name: >-
  ${{ inputs.publish_release && 'Release' || 'Build' }} Daisy DM
  ${{ inputs.version != '' && inputs.version || '(automatic version)' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z or vx.y.z). Leave blank to generate one."
        required: false
        type: string
      publish_release:
        description: "Create the tag and publish a GitHub release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
      release_notes:
        description: "Optional release notes. Leave blank for generated notes."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daisy-dm-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build universal macOS app
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail

          find Sources SafariExtension -name '*.swift' -print0 \
            | xargs -0 xcrun swiftc -frontend -parse

          for file in chrome_ext/*.js SafariExtension/Resources/*.js; do
            node --check "$file"
          done

          python3 - <<'PY'
          import json
          import plistlib
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())

          for path in (
              Path('Sources/Daisy/Resources/Info.plist'),
              Path('SafariExtension/Info.plist'),
              Path('SafariExtension/Extension.entitlements'),
              Path('Sources/Daisy/Resources/Daisy.entitlements'),
          ):
              with path.open('rb') as handle:
                  plistlib.load(handle)
          PY

      - name: Prepare release metadata
        id: metadata
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${REQUESTED_VERSION#v}"
          if [[ -z "$version" ]]; then
            year="$(date -u +%Y)"
            month="$((10#$(date -u +%m)))"
            day="$((10#$(date -u +%d)))"
            version="${year}.${month}${day}.${GITHUB_RUN_NUMBER}"
          fi

          VERSION="$version" python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ['VERSION']
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){2}', version):
              sys.exit('version must contain exactly three numeric components (for example 1.2.3)')

          components = [int(part) for part in version.split('.')]
          if any(component > 65535 for component in components):
              sys.exit('each version component must be between 0 and 65535')
          PY

          tag="v${version}"
          release_name="Daisy DM ${tag}"
          artifact_name="daisy-dm-${version}"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_name=$release_name"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

          {
            echo "DAISY_VERSION=$version"
            echo "DAISY_TAG=$tag"
            echo "DAISY_RELEASE_NAME=$release_name"
            echo "DAISY_ARTIFACT_NAME=$artifact_name"
          } >> "$GITHUB_ENV"

          VERSION="$version" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          for path in (
              Path('chrome_ext/manifest.json'),
              Path('SafariExtension/Resources/manifest.json'),
          ):
              manifest = json.loads(path.read_text())
              manifest['version'] = version
              path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -project Daisy.xcodeproj -scheme Dispatch -list

      - name: Import signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/apple-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"

          CERTIFICATE_PATH="$certificate_path" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = ''.join(os.environ['APPLE_CERTIFICATE_P12_BASE64'].split())
          Path(os.environ['CERTIFICATE_PATH']).write_bytes(
              base64.b64decode(encoded, validate=True)
          )
          PY

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain_path"

          identity_line="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk '/[0-9A-F]{40}/ { print; exit }'
          )"
          identity_hash="$(awk '{ print $2 }' <<< "$identity_line")"
          identity_name="$(sed -E 's/^[[:space:]]*[0-9]+\) [0-9A-F]+ "(.*)"/\1/' <<< "$identity_line")"

          if [[ ! "$identity_hash" =~ ^[0-9A-F]{40}$ ]]; then
            echo "No usable code-signing identity was found in the P12 certificate." >&2
            exit 1
          fi

          {
            echo "APPLE_KEYCHAIN_PATH=$keychain_path"
            echo "APPLE_SIGNING_IDENTITY=$identity_hash"
            echo "APPLE_SIGNING_IDENTITY_NAME=$identity_name"
          } >> "$GITHUB_ENV"

          rm -f "$certificate_path"
          echo "Using signing identity: $identity_name"

      - name: Archive universal app
        shell: bash
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/Daisy.xcarchive"
          rm -rf "$archive_path"

          xcodebuild \
            -project Daisy.xcodeproj \
            -scheme Dispatch \
            -configuration Release \
            -archivePath "$archive_path" \
            archive \
            MARKETING_VERSION="$DAISY_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Sign archived app
        shell: bash
        run: |
          set -euo pipefail

          app="$RUNNER_TEMP/Daisy.xcarchive/Products/Applications/Daisy.app"

          sign() {
            codesign \
              --force \
              --sign "$APPLE_SIGNING_IDENTITY" \
              --keychain "$APPLE_KEYCHAIN_PATH" \
              --options runtime \
              --timestamp \
              --preserve-metadata=identifier,entitlements,requirements \
              "$1"
          }

          while IFS= read -r -d '' nested_code; do
            sign "$nested_code"
          done < <(
            find "$app/Contents" -depth \
              \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' -o -name '*.appex' \) \
              -print0
          )

          sign "$app"

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail

          app="$RUNNER_TEMP/Daisy.xcarchive/Products/Applications/Daisy.app"
          executable="$app/Contents/MacOS/Daisy"
          extension="$app/Contents/PlugIns/DaisyExtension.appex"

          test -d "$app"
          test -x "$executable"
          test -d "$extension"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$extension"

          signing_details="$(codesign -dv --verbose=4 "$app" 2>&1)"
          grep -q '^Authority=' <<< "$signing_details"
          if grep -q '^Signature=adhoc$' <<< "$signing_details"; then
            echo "The app is still ad-hoc signed." >&2
            exit 1
          fi

          architectures="$(lipo -archs "$executable")"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]

          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          extension_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$extension/Contents/Info.plist")"
          [[ "$app_version" == "$DAISY_VERSION" ]]
          [[ "$extension_version" == "$DAISY_VERSION" ]]

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          app="$RUNNER_TEMP/Daisy.xcarchive/Products/Applications/Daisy.app"
          mkdir -p dist

          app_archive="dist/Daisy-DM-${DAISY_VERSION}-macOS-universal.zip"
          chrome_archive="dist/Daisy-DM-${DAISY_VERSION}-Chrome.zip"

          ditto -c -k --sequesterRsrc --keepParent "$app" "$app_archive"
          ditto -c -k --keepParent chrome_ext "$chrome_archive"

          cat > dist/BUILD-INFO.txt <<INFO
          Daisy DM ${DAISY_VERSION}
          Tag: ${DAISY_TAG}
          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Architectures: arm64, x86_64
          Signing: ${APPLE_SIGNING_IDENTITY_NAME} (not notarized)
          INFO

          (
            cd dist
            shasum -a 256 *.zip > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## Daisy DM build complete"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${DAISY_VERSION}\` |"
            echo "| Proposed tag | \`${DAISY_TAG}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Architectures | \`arm64\`, \`x86_64\` |"
            echo "| Signing identity | \`${APPLE_SIGNING_IDENTITY_NAME}\` |"
            echo "| GitHub release requested | \`${{ inputs.publish_release }}\` |"
            echo
            echo "> The macOS app is certificate-signed but is not notarized."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Ensure tag is new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          args=(
            release create "$TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_NAME"
          )

          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
            args+=(--notes-file release-notes.md)
          else
            args+=(--generate-notes)
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

      - name: Write release summary
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "## GitHub release published"
            echo
            echo "Release: [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
