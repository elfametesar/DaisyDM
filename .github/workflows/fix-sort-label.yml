name: Fix sort toolbar label

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add explicit sort label style
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Sources/Daisy/UI/Screens/ContentView.swift')
          text = path.read_text()
          old = '''                .help("Sort Downloads")\n                .menuStyle(.button)\n                .tint(.primary)'''
          new = '''                .help("Sort Downloads")\n                .menuStyle(.button)\n                .labelStyle(.titleAndIcon)\n                .tint(.primary)'''
          if old not in text:
              raise SystemExit('expected Sort menu block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/Daisy/UI/Screens/ContentView.swift
          git commit -m 'fix: show Sort label in toolbar'
          git push origin main
