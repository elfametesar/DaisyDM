name: Fix sidebar resizing
"on":
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make sidebar non-resizable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/Daisy/UI/Screens/ContentView.swift')
          s = p.read_text()
          old = '''    private var mainLayout: some View {\n        NavigationSplitView(columnVisibility: .constant(.all)) {\n            sidebarColumn\n        } detail: {\n            contentAndDetailColumn\n        }\n        .toolbar(removing: .sidebarToggle)'''
          new = '''    private var mainLayout: some View {\n        HStack(spacing: 0) {\n            sidebarColumn\n                .frame(width: isCompactSidebar ? 105 : 190)\n\n            Divider()\n\n            contentAndDetailColumn\n                .frame(maxWidth: .infinity, maxHeight: .infinity)\n        }'''
          old_sidebar = '''    @ViewBuilder\n    private var sidebarColumn: some View {\n        SidebarView(selected: $selectedFilter, engine: engine, onSettings: { showingSettings = true })\n            .navigationSplitViewColumnWidth(\n                min: isCompactSidebar ? 105 : 170,\n                ideal: isCompactSidebar ? 105 : 190,\n                max: isCompactSidebar ? 105 : 220\n            )\n    }'''
          new_sidebar = '''    @ViewBuilder\n    private var sidebarColumn: some View {\n        SidebarView(selected: $selectedFilter, engine: engine, onSettings: { showingSettings = true })\n    }'''
          if old not in s or old_sidebar not in s:
              raise SystemExit('expected layout patterns not found')
          p.write_text(s.replace(old, new, 1).replace(old_sidebar, new_sidebar, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-sidebar-resizing.yml
          git add Sources/Daisy/UI/Screens/ContentView.swift
          git commit -m 'fix: make sidebar fixed width'
          git push
